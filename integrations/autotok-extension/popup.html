<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>AutoTok P0</title>
<style>
body{font:12px/1.4 Segoe UI,sans-serif;width:420px;margin:8px}
input,select,button{font:inherit;margin:2px 0}
input[type=text],input[type=password]{width:100%;box-sizing:border-box}
pre{background:#111;color:#ddd;padding:6px;max-height:220px;overflow:auto;white-space:pre-wrap;margin:4px 0}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#state{font-weight:bold}
</style></head><body>
<div id="state">...</div>
<div id="poll"></div>
<div class="row">
  <button id="selfcheck">Tự kiểm (không đăng)</button>
  <button id="pollnow">Hỏi job ngay</button>
  <button id="clear">Xoá job/log</button>
  <button id="copy">Chép kết quả cuối</button>
</div>
<details><summary>Cài đặt</summary>
  Địa chỉ dev server <input type="text" id="server">
  Token <input type="password" id="token">
  Kiểu cửa sổ
  <select id="strategy"><option value="minimized">Thu nhỏ (minimized)</option><option value="unfocused">Cửa sổ thường, không focus</option><option value="tab">Tab nền</option></select>
  <label><input type="checkbox" id="keepOpen"> Giữ cửa sổ sau khi xong (để xem)</label>
  <label><input type="checkbox" id="polling"> Bật nhận job</label>
  <button id="save">Lưu</button>
</details>
<b>Log</b><pre id="log"></pre>
<b>Kết quả cuối</b><pre id="last"></pre>
<script src="popup.js"></script>
</body></html>
